<path d="M100 60 C80 90 110 110 140 104" fill="none" stroke="#FF9966" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M132 60 C150 70 156 86 150 98" fill="none" stroke="#FF9966" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="110" y="34" width="10" height="12" fill="#FF9966"/>
<circle cx="115" cy="28" r="12" fill="#FF9966"/>
<path d="M102 28 Q100 10 118 12 Q136 14 128 34 Q128 20 116 22 Q108 22 104 34 Z" fill="#FFCC33"/>
</g>

<g class="working-pixels" fill="none" stroke="#FFCC33" stroke-width="4" stroke-linecap="round">
  <path d="M202 61 v17 M194 69 h17"/>
  <path d="M73 42 v10 M68 47 h10" stroke="#FF6666" stroke-width="3"/>
</g>
</svg>