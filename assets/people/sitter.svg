<path d="M68 204 H170 M68 220 H150" stroke="#CC99FF" stroke-width="5" stroke-linecap="round"/>
<path d="M110 112 C120 140 150 150 166 168" fill="none" stroke="#FF6666" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M124 112 C140 136 170 132 190 150" fill="none" stroke="#FF6666" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M166 168 C168 200 166 230 172 262" fill="none" stroke="#FF9966" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M190 150 C200 180 206 210 214 240" fill="none" stroke="#FF9966" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M160 260 Q176 250 192 262 L192 268 L160 268 Z" fill="#333366"/>
<path d="M206 238 Q222 228 236 242 L236 248 L206 248 Z" fill="#333366"/>
<g class="typing-person">
<path d="M92 50 Q118 40 140 52 L136 116 Q112 124 92 116 Z" fill="#33CCCC"/>
<rect class="laptop-glow" x="132" y="84" width="54" height="34" rx="4" fill="#CCCCCC" transform="rotate(-14 160 100)"/>
