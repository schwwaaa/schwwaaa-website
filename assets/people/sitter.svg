<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 270" role="img" aria-label="An employee working on a laptop while sitting on a giant floppy disk"><title>An employee working on a laptop while sitting on a giant floppy disk</title>

<style>
  .typing-person { transform-origin: 116px 110px; animation: typing-bop 2.8s ease-in-out infinite; }
  .laptop-glow { animation: screen-blink 4.3s steps(2,end) infinite; }
  .working-pixels { transform-origin: 194px 70px; animation: pixel-twinkle 2.8s ease-in-out infinite; }
  @keyframes typing-bop {
    0%, 100% { transform: translateY(0px) rotate(-1deg); }
    25% { transform: translateY(-3px) rotate(1deg); }
    50% { transform: translateY(-1px) rotate(-1deg); }
    75% { transform: translateY(-4px) rotate(1deg); }
  }
  @keyframes screen-blink { 0%, 76%, 100% { fill: #CCCCCC; } 80%, 96% { fill: #33CCCC; } }
  @keyframes pixel-twinkle { 0%, 100% { opacity: .2; transform: scale(.85) rotate(-5deg); } 50% { opacity: 1; transform: scale(1.1) rotate(7deg); } }
  @media (prefers-reduced-motion: reduce) {
    .typing-person, .laptop-glow, .working-pixels { animation: none !important; }
  }
</style>
<ellipse cx="120" cy="252" rx="100" ry="9" fill="#333366" opacity=".15"/>
<rect x="30" y="120" width="180" height="130" rx="8" fill="#6666FF"/>
<rect x="74" y="120" width="92" height="44" fill="#CCCCCC"/><rect x="134" y="126" width="18" height="32" fill="#6666FF"/>
